<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered Word Frequency Analyzer</title>
</head>
<body>
    <header>
        <h1>AI-Powered Word Frequency Analyzer </h1>
        <p>Analyze the frequency of words in your text using AI technology.</p>
    </header>
    <main>
        <div>
            <label for="text-input">Enter your text here:</label>
            <textarea id="text-input" rows="10" cols="50"></textarea>
        </div>
        <div>
            <label for="word-input">Word for analysis:</label>
            <input type="text" id="word-input">
        </div>
        <div>
            <label for="Google-API-Key">Google API Key(Optional):</label>
            <input type="text" id="Google-API-Key">
        </div>
        
    </main>
</body>
</html>
